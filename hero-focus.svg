<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Focused work environment</title>
  <desc id="desc">A calm workspace with a person using headphones at a laptop, surrounded by subtle focus and idea motifs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9d0c1"/>
      <stop offset="1" stop-color="#f3eee5"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a5139"/>
      <stop offset="1" stop-color="#a87550"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="760" fill="url(#bg)"/>
  <circle cx="1320" cy="145" r="92" fill="#efe2d2"/>
  <circle cx="1320" cy="145" r="55" fill="#e5d1b8"/>
  <rect x="0" y="585" width="1600" height="175" fill="url(#desk)"/>

  <!-- window -->
  <rect x="100" y="70" width="460" height="360" rx="24" fill="#c8d6d3" opacity=".8"/>
  <path d="M330 70V430M100 250H560" stroke="#f8f4ed" stroke-width="12"/>
  <circle cx="450" cy="145" r="48" fill="#f3d99c" opacity=".85"/>
  <path d="M155 365c90-110 170-100 255-15 35 35 75 38 120 12" fill="none" stroke="#8ea69c" stroke-width="34" opacity=".7"/>

  <!-- plant -->
  <path d="M1260 560c0-105 12-165 48-215M1260 560c-50-95-70-135-92-160M1260 560c64-78 92-114 138-130" fill="none" stroke="#53685b" stroke-width="18" stroke-linecap="round"/>
  <ellipse cx="1200" cy="382" rx="55" ry="25" transform="rotate(-35 1200 382)" fill="#718b77"/>
  <ellipse cx="1300" cy="345" rx="58" ry="27" transform="rotate(30 1300 345)" fill="#78917d"/>
  <ellipse cx="1395" cy="430" rx="62" ry="28" transform="rotate(-20 1395 430)" fill="#607b68"/>
  <path d="M1200 550h150l-18 70h-115z" fill="#c9b49d"/>

  <!-- laptop -->
  <rect x="725" y="300" width="500" height="285" rx="18" fill="#242626"/>
  <rect x="750" y="325" width="450" height="235" rx="8" fill="#d7dfdd"/>
  <path d="M680 585h600l-70 42H750z" fill="#393b39"/>
  <rect x="925" y="603" width="110" height="9" rx="4" fill="#777a74"/>

  <!-- person -->
  <ellipse cx="610" cy="415" rx="72" ry="78" fill="#c88d68"/>
  <path d="M545 405c0-84 136-92 147 2-33-20-78-20-147-2z" fill="#343433"/>
  <path d="M575 465c70-20 128 35 145 120H535c5-70 12-104 40-120z" fill="#556b77"/>
  <path d="M648 515l105 65-20 28-112-60z" fill="#c88d68"/>
  <path d="M580 520l-84 68 20 25 100-62z" fill="#c88d68"/>
  <!-- headphones -->
  <path d="M530 400c0-70 160-82 176 5" fill="none" stroke="#3c4140" stroke-width="22" stroke-linecap="round"/>
  <rect x="516" y="390" width="35" height="78" rx="17" fill="#343938"/>
  <rect x="685" y="390" width="35" height="78" rx="17" fill="#343938"/>

  <!-- notebook -->
  <rect x="245" y="605" width="280" height="95" rx="12" fill="#f5f0e7" transform="rotate(-5 245 605)"/>
  <path d="M280 635h175M275 660h145" stroke="#b7aa99" stroke-width="8" stroke-linecap="round"/>

  <!-- focus/idea motif -->
  <g transform="translate(1090 90)">
    <circle cx="0" cy="0" r="62" fill="#f8f1e6" stroke="#b86a32" stroke-width="5"/>
    <path d="M-22 12c-25-35 2-70 31-58 34 13 34 58 8 74-8 5-11 14-11 22h-30c0-13-1-20- -? 0" fill="none" stroke="#b86a32" stroke-width="7"/>
    <path d="M-22 65h45M-17 80h35" stroke="#b86a32" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g fill="#b86a32" opacity=".55">
    <circle cx="1430" cy="180" r="7"/>
    <circle cx="1365" cy="235" r="5"/>
    <circle cx="1480" cy="275" r="6"/>
    <circle cx="1140" cy="240" r="5"/>
  </g>

  <text x="90" y="530" fill="#2d2e2b" font-family="Georgia, serif" font-size="48" font-weight="700">Create the conditions for better thinking.</text>
  <text x="94" y="565" fill="#68645d" font-family="Arial, sans-serif" font-size="22">Focus • Recovery • Clarity • Creative space</text>
</svg>
